services:
  media-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown 1000:1000 /data && chmod 0770 /data"]
    volumes:
      - media:/data
    restart: "no"

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
      args:
        PLAYWRIGHT_MCP_IMAGE: ${PLAYWRIGHT_MCP_IMAGE:-mcr.microsoft.com/playwright/mcp:latest}
    command:
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --caps=storage,devtools
      - --isolated
      - --output-dir
      - /data/media
    volumes:
      - media:/data/media
    depends_on:
      media-init:
        condition: service_completed_successfully
    expose:
      - "8931"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8931/mcp').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    init: true
    restart: unless-stopped

  graph:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PLAYWRIGHT_MCP_URL: http://playwright:8931/mcp
      INSIGHT_MEDIA_DIR: /data/media
      INSIGHT_AUTH_SCRATCH_DIR: /data/media/auth
    volumes:
      - media:/data/media
    depends_on:
      media-init:
        condition: service_completed_successfully
      playwright:
        condition: service_healthy
    ports:
      - "127.0.0.1:2024:2024"
    init: true
    restart: unless-stopped

volumes:
  media:
